[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/metadata",
    "crates/ingest",
    "crates/frontier",
    "crates/fetcher",
    "crates/indexer",
    "crates/parser",
    "crates/discovery",
    "crates/router",
    "crates/browser",
    "crates/pdf",
    "crates/sources",
    "crates/graph",
    "crates/retrieval",
    "crates/eval",
    "crates/embed",
    "crates/rerank",
    "crates/scheduler",
    "crates/bench",
    "crates/nav",
    "crates/dedup",
    "crates/tiers",
    "crates/patterns",
    "crates/dataset",
    "crates/mcp",
    "crates/trace",
    "crates/cache",
    "crates/ann",
    "crates/distill",
    "crates/acceptance",
    "crates/api",
    "crates/agent0",
    "crates/organize",
    "crates/engine",
    "crates/answer",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
url = "2"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
regex = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
tantivy = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["gzip", "brotli", "rustls-tls", "stream"] }
axum = "0.7"
# Opt-in CORS for a browser-hosted UI (see SEARCH_CORS_ORIGIN).
tower-http = { version = "0.6", features = ["cors"] }
scraper = "0.20"
html-escape = "0.2"
quick-xml = "0.36"
flate2 = "1"
mime = "0.3"
tempfile = "3"
# Real BGE-small embedding lane (feature `bge`). Default features are off so the image
# pipeline is not pulled in; the two flags below are what the ONNX Runtime + HF download
# path needs. The model weights are fetched at RUNTIME into the cache dir (see
# `search_embed::bge::default_cache_dir`), never at build time and never committed.
fastembed = { version = "7.1.1", default-features = false, features = [
    "hf-hub-native-tls",
    "ort-download-binaries-native-tls",
] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

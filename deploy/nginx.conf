# nginx front end for the search engine.
#
#   /            -> static UI build (ui/package.json `deploy` writes /var/www/search)
#   /search      -> proxied to the local search-api (127.0.0.1:8080)
#   /health      -> proxied health/telemetry endpoint
#
# The UI resolves its API base from `VITE_API_BASE`; build it with an empty
# value (same-origin) so these relative paths are used, or set it to this
# host's public URL. Install to /etc/nginx/sites-available/search and symlink
# into sites-enabled, then `nginx -t && systemctl reload nginx`.

upstream search_api {
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name search.example.com;

    root /var/www/search;
    index index.html;
    charset utf-8;

    # --- gzip -----------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml
        application/wasm
        image/svg+xml;

    # --- API proxy ------------------------------------------------------
    # Search is CPU/IO bound; allow a slow deep query but bound it.
    location = /search {
        proxy_pass http://search_api/search;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering on;
        client_max_body_size 1m;
    }

    location = /health {
        proxy_pass http://search_api/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
        access_log off;
    }

    # --- static UI ------------------------------------------------------
    # Hashed, content-addressed assets are immutable; never cache the shell.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

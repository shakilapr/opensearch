# §6/§8 query planning: the LLM deconstructs a question into entity/phrase probes that are searched
# beside the original query.
#
# Install with the unit:
#   install -d /etc/systemd/system/search-api.service.d
#   install -m 644 deploy/search-api.service.d/planner.conf /etc/systemd/system/search-api.service.d/
#   systemctl daemon-reload && systemctl restart search-api.service
#
# The key is NOT in this file. It lives in /etc/search/planner.env, root-owned mode 0600, which
# systemd reads before dropping to User=search:
#   install -d -m 700 /etc/search && ( umask 077; echo "KITANI_API_KEY=$KITANI_API_KEY" > /etc/search/planner.env )
#
# Model: the default is deepseek/deepseek-v4.1-flash-thinking (slow: a cold call was measured at
# 83 s on the live host, and cached repeats at 2 s). Set SEARCH_PLANNER_MODEL to the cheap model
# when that latency is not wanted.

[Service]
EnvironmentFile=/etc/search/planner.env
Environment=SEARCH_PLANNER_ENABLED=1

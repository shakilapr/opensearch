[package]
name = "search-bench"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "search_bench"
path = "src/lib.rs"

[[bin]]
name = "bench"
path = "src/main.rs"

[features]
# Passthrough to `search-embed/bge`: `cargo run -p search-bench --features bge -- --embedder bge`
bge = ["search-embed/bge"]

[dependencies]
search-core = { path = "../core" }
search-indexer = { path = "../indexer" }
search-parser = { path = "../parser" }
search-eval = { path = "../eval" }
search-embed = { path = "../embed" }
search-rerank = { path = "../rerank" }
search-retrieval = { path = "../retrieval" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tempfile.workspace = true

[dev-dependencies]
tempfile.workspace = true

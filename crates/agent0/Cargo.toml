[package]
name = "search-agent0"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "search_agent0"
path = "src/lib.rs"

[[bin]]
name = "agent0"
path = "src/main.rs"

[dependencies]
search-core = { path = "../core" }
search-metadata = { path = "../metadata" }
search-ingest = { path = "../ingest" }
search-indexer = { path = "../indexer" }
search-frontier = { path = "../frontier" }
search-fetcher = { path = "../fetcher" }
search-parser = { path = "../parser" }
# Stage-1 components wired into the pipeline.
search-discovery = { path = "../discovery" }
search-router = { path = "../router" }
search-pdf = { path = "../pdf" }
search-sources = { path = "../sources" }
search-retrieval = { path = "../retrieval" }
# Stage-3 freshness scheduler wired into the crawl loop.
search-scheduler = { path = "../scheduler" }
# Stage-4 deep navigation (Navigator + SearchExecutor over the index).
search-nav = { path = "../nav" }
# Stage-8 PolicyTrace (real JSONL trace emitter/reader).
search-trace = { path = "../trace" }
# Portable knowledge model: export the index to a pack (dataset) and organize
# scraped text with the cheap model (organize).
search-dataset = { path = "../dataset" }
search-organize = { path = "../organize" }
# `real-indexer` wires the API's Searcher trait to the real Tantivy indexer
# (src/indexer_adapter.rs). agent0 owns the whole pipeline, so it enables it.
search-api = { path = "../api", features = ["real-indexer"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tokio.workspace = true
anyhow.workspace = true
url.workspace = true
reqwest.workspace = true
rusqlite.workspace = true
regex.workspace = true

[dev-dependencies]
axum.workspace = true
tempfile.workspace = true

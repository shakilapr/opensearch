[package]
name = "search-agent0"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "search_agent0"
path = "src/lib.rs"

[[bin]]
name = "agent0"
path = "src/main.rs"

[dependencies]
search-core = { path = "../core" }
search-metadata = { path = "../metadata" }
search-ingest = { path = "../ingest" }
search-indexer = { path = "../indexer" }
# Dense lane: BGE embeddings + the vector sidecar (`agent0 embed build`).
search-embed = { path = "../embed" }
search-frontier = { path = "../frontier" }
search-fetcher = { path = "../fetcher" }
search-parser = { path = "../parser" }
# Stage-1 components wired into the pipeline.
search-discovery = { path = "../discovery" }
search-router = { path = "../router" }
search-pdf = { path = "../pdf" }
search-sources = { path = "../sources" }
# Stage-1 entity/concept graph: extractor + WorkId resolution for `agent0 graph build`.
search-graph = { path = "../graph" }
# Stage-2 labelled query sets derived from the corpus (`agent0 eval build-set`).
search-eval = { path = "../eval" }
# Stage-1 §21 browser escalation (mock by default; real Chromium behind `chromium`).
search-browser = { path = "../browser" }
search-retrieval = { path = "../retrieval" }
# Stage-3 freshness scheduler wired into the crawl loop.
search-scheduler = { path = "../scheduler" }
# Stage-4 deep navigation (Navigator + SearchExecutor over the index).
search-nav = { path = "../nav" }
# Stage-8 PolicyTrace (real JSONL trace emitter/reader).
search-trace = { path = "../trace" }
# Portable knowledge model: export the index to a pack (dataset) and organize
# scraped text with the cheap model (organize).
search-dataset = { path = "../dataset" }
search-organize = { path = "../organize" }
# `real-indexer` wires the API's Searcher trait to the real Tantivy indexer
# (src/indexer_adapter.rs). agent0 owns the whole pipeline, so it enables it.
search-api = { path = "../api", features = ["real-indexer"] }
# §22.1 answer generation: `search-answer` implements search-engine's Answerer from
# the environment; `serve` passes it (or None) through to the API.
search-engine = { path = "../engine" }
search-answer = { path = "../answer" }
# §6/§8 LLM query planning: `search-planner` implements search-engine's QueryPlanner.
search-planner = { path = "../planner" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tokio.workspace = true
anyhow.workspace = true
url.workspace = true
reqwest.workspace = true
rusqlite.workspace = true
regex.workspace = true
# Gzip for the raw spill (`agent0 crawl --compress`): raw pages average ~237 KB uncompressed.
flate2.workspace = true

[dev-dependencies]
axum.workspace = true
tempfile.workspace = true

[features]
# Real BGE-small-en-v1.5 weights for the dense lane. On by default per the Stage-2 decision;
# `default-features = false` keeps a build hermetic (no ONNX Runtime, no model download).
default = ["bge"]
bge = ["search-embed/bge"]
# Real Chromium driver for browser escalation (needs a Chromium binary at runtime).
chromium = ["search-browser/chromium"]

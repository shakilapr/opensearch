[package]
name = "search-api"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "search_api"
path = "src/lib.rs"

[features]
# Wiring to the real Tantivy indexer lives behind this feature so the API crate
# never carries a hard dependency on an in-flight indexer API. Default off; the
# adapter in src/indexer_adapter.rs is compiled only when enabled.
real-indexer = ["dep:search-indexer"]

[dependencies]
search-core = { path = "../core" }
search-engine = { path = "../engine" }
search-retrieval = { path = "../retrieval" }
# §9.4 graph lane: query-time activation over the entity graph.
search-graph = { path = "../graph" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tokio.workspace = true
axum.workspace = true
tower-http.workspace = true
tower = { version = "0.5", features = ["limit", "load-shed"] }
search-indexer = { path = "../indexer", optional = true }

[dev-dependencies]
# Router-level tests drive the app with `ServiceExt::oneshot` (no socket).
tower = { version = "0.5", features = ["util"] }
tempfile.workspace = true

[package]
name = "search-api"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "search_api"
path = "src/lib.rs"

[features]
# Wiring to the real Tantivy indexer lives behind this feature so the API crate
# never carries a hard dependency on an in-flight indexer API. Default off; the
# adapter in src/indexer_adapter.rs is compiled only when enabled.
real-indexer = ["dep:search-indexer"]

[dependencies]
search-core = { path = "../core" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tokio.workspace = true
axum.workspace = true
tower = { version = "0.5", features = ["limit", "load-shed"] }
search-indexer = { path = "../indexer", optional = true }

[dev-dependencies]
tempfile.workspace = true
